# Dependabot configuration.
#
# Frontend package.json files are not watched. Rendered templates must stay
# identical to their cookiecutter sources
# (`./dev.py templates-check-not-modified`), so a lone npm bump cannot merge.
# Update the cookiecutter source and refresh the rendered templates with
# `./dev.py templates-update` instead.
#
# GitHub Actions have no cross-manifest constraint, so these PRs are always
# mergeable on their own. Keeps actions/checkout, actions/setup-node, etc. current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
