name: CI

on:
  push:
    branches: 
      - "master"
  pull_request:
    branches: 
      - "master"

jobs:
  build-frontends:
    runs-on: ubuntu-latest
    name: Vite build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: ./dev.py all-npm-install

      - name: Build frontends with Vite
        run: ./dev.py all-npm-build

  check-cookiecutter:
    runs-on: ubuntu-latest
    name: Cookiecutter

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cookiecutter
        run: |
          pip install uv
          # Cookiecutter 2.2.3 has broken replay file support used in our regression check.
          # It should still work for end users.
          # See: https://github.com/cookiecutter/cookiecutter/issues/1900
          uv tool install 'cookiecutter==2.2.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that rendered templates match the cookiecutter sources
        run: ./dev.py templates-check-not-modified
